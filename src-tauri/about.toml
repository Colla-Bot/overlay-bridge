# What `npm run licenses` lists in ../THIRD-PARTY-LICENSES.txt: the crates built into the program
# for the platforms it is made for, with their licenses. Where a crate offers a choice, the first
# license here that it offers is taken.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
