[package]
name = "collabot-overlay-bridge"
version = "0.1.0"
description = "Tells CollaBot Overlay who is speaking in your Discord voice channel"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's default features but for `compression`, as the pages are a few kilobytes, and
# `dynamic-acl`, as the bridge adds no permissions at runtime.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "common-controls-v6",
    "x11",
    "dbus",
    "tray-icon",
] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `system-proxy` so that the token service is reached through the proxy set in the system's
# settings, as Discord itself does.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
    "system-proxy",
] }

# For a small download, as https://v2.tauri.app/concept/size/ suggests, but with `opt-level` "z"
# where it suggests "s": that makes the program 12% smaller still, and its speed does not matter,
# as it passes on a few small messages a second.
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
